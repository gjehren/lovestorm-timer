<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lovestorm Timer</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    background:#f0f4f8;
    color:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
  }
  .timer{
    background:#fff;
    padding:2rem 3rem;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    text-align:center;
  }
  h1{margin:0 0 .5rem;font-size:1.8rem;}
  .count{font-size:2.5rem;letter-spacing:.05em;}
  .subtext{margin-top:.75rem;font-size:0.95rem;color:#555;}
</style>
</head>
<body>
<div class="timer" id="timer">
  <h1>Next Lovestorm in:</h1>
  <div class="count" id="countdown">--:--:--</div>
  <div class="subtext" id="info"></div>
</div>

<script>
(() => {
  const countEl = document.getElementById('countdown');
  const infoEl  = document.getElementById('info');

  const pad = n => String(n).padStart(2,'0');

  // 7 PM EST, February 8 2026 → UTC (EST = UTC‑5)
  const startUTC = Date.UTC(2026, 1, 8, 19 + 5, 0, 0); // month is 0‑based
  const INTERVAL_MS = 3 * 60 * 60 * 1000; // three hours

  function update() {
    const now = Date.now();

    const elapsed         = now - startUTC;
    const intervalsPassed = Math.floor(elapsed / INTERVAL_MS);

    // End of the current interval (also the start of the next one)
    const currentEndUTC = startUTC + (intervalsPassed + 1) * INTERVAL_MS;
    const diff = currentEndUTC - now;

    if (diff <= 0) {
      countEl.textContent = '00:00:00';
      infoEl.textContent  = '';
      return;
    }

    const hrs  = Math.floor(diff / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    // Local‑time strings for the user
    const options = {
      weekday:'short', year:'numeric', month:'short',
      day:'numeric', hour:'numeric', minute:'2-digit',
      hour12:true, timeZoneName:'short'
    };
    const endLocal   = new Date(currentEndUTC).toLocaleString(undefined, options);
    const startLocal = endLocal; // same instant – start of next interval

    countEl.textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
    infoEl.textContent  = `Current interval ends at ${endLocal}.`;
  }

  update();                // initial display
  setInterval(update,1000);// refresh each second
})();
</script>
</body>
</html>
